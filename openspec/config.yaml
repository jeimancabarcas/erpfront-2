project: erpfrontend
context: |
  Angular 21 frontend application for the ERP system.
  It uses TypeScript, Prettier, Tailwind CSS, and Vitest for unit testing.
strict_tdd: true
testing:
  runner:
    command: npm run test -- --watch=false
    framework: vitest
  layers:
    unit:
      available: true
      tool: vitest
    integration:
      available: false
      tool: ""
    e2e:
      available: false
      tool: ""
  coverage:
    available: false
    command: ""
  quality_tools:
    linter:
      available: false
      command: ""
    type_checker:
      available: true
      command: npx tsc --noEmit
    formatter:
      available: true
      command: npx prettier --check .
phase_rules:
  proposal:
    artifact_store: hybrid
  spec:
    artifact_store: hybrid
  design:
    artifact_store: hybrid
  tasks:
    artifact_store: hybrid
  apply:
    artifact_store: hybrid
  verify:
    artifact_store: hybrid
  archive:
    artifact_store: hybrid
